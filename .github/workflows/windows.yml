name: Windows compatibility

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python tests/epub_check.py
      - run: python tests/index_check.py
      - run: python tests/cli_check.py
      - run: python tests/envelope_check.py
      - run: python tests/encoding_check.py
