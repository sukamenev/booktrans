# Семейство good-*: запасная пара, когда лучший редактор недоступен.
# Codex переводит, Gemini редактирует — на случай исчерпанного Claude.
# Чужой редактор снимает кальки наравне с лучшим; шумит вкусовой правкой
# чаще Opus. Запасным у редактора — сам Sol.
--agent codex
--effort high
--editor     agy:gemini-3.1-pro-high,gpt-5.6-sol:high
--formatter  gpt-5.6-terra:high
--ocrfixer   gpt-5.6-terra:low
# Модель для распознавания картинок (PDF). По умолчанию берётся основная модель агента.
--ocrmodel gpt-5.6-terra:high,gpt-5.6-sol:high,local:pdftotext
--jobs 2
