# Лучшее из двух семей: Codex переводит, Claude редактирует.
# Замерено на живой главе: черновик Sol — самый чистый из трёх, а Opus по
# чужому тексту правит точно и скупо (34 правки против 61 у прочих), снимая
# кальки и расставляя русскую типографику; свой же редактор их пропускает.
--agent codex
--scout      gpt-5.6-sol:high
--translator gpt-5.6-sol:medium
--editor     claude:claude-opus-5:medium,gpt-5.6-sol:medium
# Переводчик стоит запасным редактором: свой кусок ему не давать.
--self-edit  never
--formatter  gpt-5.6-terra:high
--ocrfixer   gpt-5.6-terra:low
# Модель для распознавания картинок (PDF). По умолчанию берётся основная модель агента.
--ocrmodel gpt-5.6-terra:high,gpt-5.6-sol:high,local:pdftotext
--jobs 2
