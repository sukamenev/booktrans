# Флагманы двух семей: Astra переводит, Fable редактирует.
# По бенчмарку конвейера черновик Astra — самый чистый из всех замеренных;
# редактор другой семьи снимает кальки, к которым свой переводчик слеп.
--agent codex
--scout      gpt-6-astra:high
--translator gpt-6-astra:medium
--editor     claude:claude-fable-5-1:medium,gpt-6-astra:medium
# Переводчик стоит запасным редактором: свой кусок ему не давать.
--self-edit  never
--formatter  gpt-5.6-terra:high
--ocrfixer   gpt-5.6-terra:low
# Модель для распознавания картинок (PDF). По умолчанию берётся основная модель агента.
--ocrmodel gpt-5.6-terra:high,gpt-6-astra:medium,local:pdftotext
--jobs 2
