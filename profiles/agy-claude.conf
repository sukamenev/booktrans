# То же, что agy, но последним звеном — Opus через сам Claude Code.
# Другой поставщик: свой счёт лимитов и отказы не на тех же местах.
# Нужен установленный claude. Он же выручает, когда Flash отказывается от
# современного романа (на живой книге — от половины кусков), а общая квота
# Opus и Sonnet в Antigravity за ночь такой книги кончается на неделю.
--agent agy
--translator gemini-3.8-flash-medium,claude-opus-5-5-medium,claude:claude-opus-5-5:medium
--editor     claude-opus-5-5-medium,gemini-3.8-flash-high,claude:claude-sonnet-5-5
--scout      gemini-3.8-flash-medium,claude-opus-5-5-medium,claude:claude-opus-5-5
--formatter  gemini-3.8-flash-low,claude-sonnet-5-5-low,gpt-oss-120b-medium,claude:claude-sonnet-5-5
--ocrfixer   gemini-3.8-flash-low,claude-sonnet-5-5-low,gpt-oss-120b-medium,claude:claude-sonnet-5-5
# Модель для распознавания картинок (PDF). По умолчанию берётся основная модель агента.
--ocrmodel gemini-3.8-flash-high,claude-sonnet-5-5-low,claude:claude-sonnet-5-5:high,local:pdftotext
--jobs 2
# Переведшая модель и её родня встают в конец очереди редакторов, а не
# вычёркиваются: чужой редактор, когда он есть, а когда нет — правка в
# своей семье лучше куска без правки.
--self-edit last
