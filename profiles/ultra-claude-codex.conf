# Флагманы двух семей: Fable переводит, Astra редактирует.
# По бенчмарку конвейера обе модели — лучшие в своих семьях; редактор другой
# семьи снимает кальки, к которым свой переводчик слеп.
--agent claude
--translator claude-fable-5-1:medium
--editor     codex:gpt-6-astra:medium,claude-fable-5-1:high
# Переводчик стоит запасным редактором: свой кусок ему не давать.
--self-edit  never
--scout      claude-fable-5-1:high
--formatter  claude-sonnet-5:high
--ocrfixer   claude-sonnet-5:low
# Модель для распознавания картинок (PDF). По умолчанию берётся основная модель агента.
--ocrmodel claude-sonnet-5:high,local:pdftotext
--jobs 2
