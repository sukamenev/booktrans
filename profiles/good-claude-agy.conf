# Семейство good-*: запасная пара на случай, когда лучший редактор недоступен.
# Claude переводит, Gemini редактирует. Замерено: кальки чужой редактор
# снимает наравне с лучшим (самослепота страшнее слабости), заёмный синтаксис
# ловит хуже Sol, изредка шумит вкусовой правкой. Обрыв на спорной сцене
# прикрыт запасным Opus в цепочке.
--agent claude
--translator claude-opus-5:high
--editor     agy:gemini-3.1-pro-high,claude-opus-5:high
--scout      claude-opus-5:high
--formatter  claude-sonnet-5:high
--ocrfixer   claude-sonnet-5:low
# Модель для распознавания картинок (PDF). По умолчанию берётся основная модель агента.
--ocrmodel claude-sonnet-5:high,local:pdftotext
--jobs 2
