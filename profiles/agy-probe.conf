# Проверка механики перевода на дешёвых моделях.
#
# Годится, чтобы прогнать книгу насквозь и убедиться, что всё на месте:
# разметка, сноски, картинки, сборка. Читать такой перевод не стоит — Flash
# держит смысл, но не голос автора и не единство терминов на длинной книге.
# Для настоящего перевода берите agy или agy-claude.
--agent agy
--translator gemini-3.7-flash-high,claude-sonnet-4-6,gpt-oss-120b-medium
--editor     gemini-3.7-flash-high,claude-sonnet-4-6,gpt-oss-120b-medium
--scout      gemini-3.7-flash-high,claude-sonnet-4-6,gpt-oss-120b-medium
--formatter  gemini-3.7-flash-low,claude-sonnet-4-6,gpt-oss-120b-medium
--ocrfixer   gemini-3.7-flash-low,claude-sonnet-4-6,gpt-oss-120b-medium
# Модель для распознавания картинок (PDF). По умолчанию берётся основная модель агента.
# --ocrmodel gemini-3.6-pro:high
--jobs 3
