# Лучшее из двух семей: Claude переводит, Codex редактирует.
# Замерено на живой главе: перевод Opus живее по ритму и голосу, а редактор
# другой семьи снимает его кальки («всё время мира» → «когда впереди
# вечность») и чужой синтаксис, которые свой же редактор пропускает.
--agent claude
--translator claude-opus-5:high
--editor     codex:gpt-5.6-sol:high,claude-opus-5:high
--scout      claude-opus-5:high
--formatter  claude-sonnet-5:high
--ocrfixer   claude-sonnet-5:low
# Модель для распознавания картинок (PDF). По умолчанию берётся основная модель агента.
--ocrmodel claude-sonnet-5:high,local:pdftotext
--jobs 2
