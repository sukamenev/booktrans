# То же, что claude, но последним звеном — модели Antigravity.
# Другой поставщик: свой счёт лимитов и отказы не на тех же местах.
# Нужен установленный agy.
--agent claude
--translator claude-opus-5-5:medium,agy:gemini-3.8-flash-medium
--editor     claude-opus-5-5,agy:gemini-3.8-flash-medium
--scout      claude-opus-5-5,agy:gemini-3.8-flash-medium
--formatter  claude-sonnet-5,agy:gemini-3.8-flash-low
--ocrfixer   claude-sonnet-5,agy:gemini-3.8-flash-low
# Модель для распознавания картинок (PDF). По умолчанию берётся основная модель агента.
# --ocrmodel claude-sonnet-5:high,agy:gemini-3.8-flash-low,local:pdftotext
--jobs 3
