# То же, что claude, но последним звеном — модели Antigravity.
# Другой поставщик: свой счёт лимитов и отказы не на тех же местах.
# Нужен установленный agy.
--agent claude
--translator claude-opus-5,agy:gemini-pro-high
--editor     claude-opus-5,agy:gemini-pro-high
--scout      claude-opus-5,agy:gemini-pro-high
--formatter  claude-sonnet-5,agy:gemini-flash-low
--ocrfixer   claude-sonnet-5,agy:gemini-flash-low
--jobs 3
