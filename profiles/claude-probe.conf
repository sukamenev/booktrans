# Проверка механики перевода на дешёвых моделях.
#
# Годится, чтобы прогнать книгу насквозь и убедиться, что всё на месте:
# разметка, сноски, картинки, сборка. Читать такой перевод не стоит — Sonnet
# выравнивает авторскую интонацию под гладкое среднее, и на длинной книге это
# видно. Для настоящего перевода берите claude или claude-agy.
--agent claude
--translator claude-sonnet-5
--editor     claude-sonnet-5
--scout      claude-sonnet-5
# Модель для распознавания картинок (PDF). По умолчанию берётся основная модель агента.
# --ocrmodel claude-3.5-sonnet
--jobs 5
