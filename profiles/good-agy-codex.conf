# Семейство good-*: запасная пара, когда лучший редактор недоступен.
# Antigravity переводит, Sol редактирует — на случай исчерпанного Claude.
# Opus внутри Antigravity остаётся запасным переводчиком: у него своя
# подписка, и спорные сцены, где Gemini молча обрывается, уходят ему.
--agent agy
--translator gemini-3.1-pro-high,claude-opus-4-6-thinking
--editor     codex:gpt-5.6-sol:high,gemini-3.1-pro-high
--scout      gemini-3.1-pro-high,claude-opus-4-6-thinking
--formatter  gemini-3.7-flash-low,claude-sonnet-4-6,gpt-oss-120b-medium
--ocrfixer   gemini-3.7-flash-low,claude-sonnet-4-6,gpt-oss-120b-medium
# Модель для распознавания картинок (PDF). По умолчанию берётся основная модель агента.
--ocrmodel gemini-3.7-flash-low,gemini-3.1-pro-high,claude-sonnet-4-6,local:pdftotext
--jobs 2
