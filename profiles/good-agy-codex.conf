# Семейство good-*: запасная пара, когда лучший редактор недоступен.
# Antigravity переводит, Sol редактирует — на случай исчерпанного Claude.
# Opus внутри Antigravity остаётся запасным переводчиком: у него своя
# подписка, и спорные сцены, где Gemini молча обрывается, уходят ему.
# Sol замыкает цепочку: Flash отказывается от современных романов целиком
# (на живой книге — от половины кусков), а квота Claude в Antigravity одна
# на Opus и Sonnet и за ночь такой книги кончается на неделю. Кусок без
# перевода не даёт собрать книгу, так что Sol в хвосте дешевле дыры.
--agent agy
--translator gemini-3.8-flash-medium,claude-opus-5-5-medium,claude-sonnet-5-5-medium,codex:gpt-5.6-sol:medium
# Запасного редактора нет нарочно: модели Antigravity — родня переводчикам,
# их кальки они не видят, а занятого Sol конвейер терпеливо дождётся.
--editor     codex:gpt-5.6-sol:medium
--scout      gemini-3.8-flash-medium,claude-opus-5-5-medium
--formatter  gemini-3.8-flash-low,claude-sonnet-5-5-low,gpt-oss-120b-medium
--ocrfixer   gemini-3.8-flash-low,claude-sonnet-5-5-low,gpt-oss-120b-medium
# Модель для распознавания картинок (PDF). По умолчанию берётся основная модель агента.
--ocrmodel gemini-3.8-flash-low,claude-sonnet-5-5-low,local:pdftotext
--jobs 2
# Переведшая модель и её родня встают в конец очереди редакторов, а не
# вычёркиваются: кусок Flash или Opus правит Sol, а кусок, который после
# отказа всех перевёл сам Sol, он же и правит — другой семьи для него в
# этом профиле нет, и самоправка лучше куска без правки.
--self-edit last
