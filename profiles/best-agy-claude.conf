# Лучшее из двух семей: Antigravity переводит, Claude редактирует.
# Замерено: чужой редактор снимает у Gemini тире в мыслях, дописанные детали
# и кальки, которые свой пропускает; спорные сцены, где Gemini молча
# обрывается, и так уходят Opus — редактор той же семьи им не чужой.
# Opus через Claude Code замыкает цепочку: Flash отказывается от современных
# романов целиком (на живой книге — от половины кусков), а квота Claude в
# Antigravity одна на Opus и Sonnet и за ночь такой книги кончается на
# неделю. Кусок без перевода не даёт собрать книгу.
--agent agy
--translator gemini-3.8-flash-medium,claude-opus-5-5-medium,claude-sonnet-5-5-medium,claude:claude-opus-5-5:medium
# Запасной редактор — тот же Opus, но через Antigravity: другой счёт лимитов.
--editor     claude:claude-opus-5-5:high,claude-opus-5-5-medium
--scout      gemini-3.8-flash-medium,claude-opus-5-5-medium
--formatter  gemini-3.8-flash-low,claude-sonnet-5-5-low,gpt-oss-120b-medium
--ocrfixer   gemini-3.8-flash-low,claude-sonnet-5-5-low,gpt-oss-120b-medium
# Модель для распознавания картинок (PDF). По умолчанию берётся основная модель агента.
--ocrmodel gemini-3.8-flash-low,claude-sonnet-5-5-low,local:pdftotext
--jobs 2
# Переведшая модель и её родня встают в конец очереди редакторов, а не
# вычёркиваются: кусок Flash правит Opus, а кусок, который после отказа
# Flash перевёл Opus или Sonnet, правит Opus другого запуска и усилия —
# чужого редактора у него в этом профиле нет, и правка в своей семье
# лучше куска без правки.
--self-edit last
